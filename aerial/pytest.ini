[pytest]
testpaths = tests
pythonpath = .
# torch-geometric 2.7.0 calls typing._eval_type without type_params on Python 3.13,
# which raises one DeprecationWarning per network construction, and torch 2.12 and
# torch-geometric 2.7 each announce a deprecation of their own on import. Silenced here
# so the suite reports its own warnings only.
filterwarnings =
    ignore:Failing to pass a value to the 'type_params' parameter of 'typing._eval_type':DeprecationWarning
    ignore:.torch_geometric.distributed. has been deprecated:DeprecationWarning
    ignore:.torch.jit.script. is deprecated:DeprecationWarning
